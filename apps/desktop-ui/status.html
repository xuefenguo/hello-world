<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenClaw Desktop v1</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f3f4f6; color: #111827; }
    header { background: #111827; color: #fff; padding: 14px 20px; }
    main { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 52px); }
    nav { background: #fff; border-right: 1px solid #e5e7eb; padding: 12px; }
    nav button { display:block; width:100%; text-align:left; margin-bottom:8px; padding:8px 10px; border:1px solid #d1d5db; background:#fff; border-radius:6px; cursor:pointer; }
    nav button.active { background:#e5edff; border-color:#6b8cff; }
    section { padding: 16px; }
    .panel { display:none; background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:14px; }
    .panel.active { display:block; }
    .row { margin:10px 0; }
    label { display:block; margin-bottom:5px; font-weight:600; }
    input, select, textarea { width:100%; padding:8px; border:1px solid #d1d5db; border-radius:6px; box-sizing:border-box; }
    button.action { margin-right:8px; padding:8px 12px; border:1px solid #9ca3af; border-radius:6px; background:#fff; cursor:pointer; }
    .ok { color:#0a7a2f; }
    .err { color:#b00020; }
    #chatBox { height: 340px; overflow-y: auto; background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; padding:10px; }
    .msg { margin:8px 0; padding:8px 10px; border-radius:8px; }
    .user { background:#dbeafe; }
    .assistant { background:#e5e7eb; }
    pre { background:#0b1020; color:#e6edf3; padding:10px; border-radius:6px; overflow:auto; }
  </style>
</head>
<body>
<header>OpenClaw Desktop v1（可安装可使用）</header>
<main>
  <nav>
    <button class="tab active" data-target="statusPanel">状态</button>
    <button class="tab" data-target="chatPanel">聊天</button>
    <button class="tab" data-target="configPanel">配置</button>
  </nav>
  <section>
    <div id="statusPanel" class="panel active">
      <h2>运行状态</h2>
      <p id="healthText">检查中...</p>
      <button class="action" id="refreshHealth">刷新健康状态</button>
      <pre id="healthPayload">{}</pre>
    </div>

    <div id="chatPanel" class="panel">
      <h2>聊天界面</h2>
      <div class="row">
        <label>Provider</label>
        <select id="provider">
          <option value="local">local（本地）</option>
          <option value="cloud">cloud（云端）</option>
        </select>
      </div>
      <div class="row">
        <label>Model</label>
        <input id="model" value="local-echo" />
      </div>
      <div id="chatBox"></div>
      <div class="row">
        <label>输入消息</label>
        <textarea id="userInput" rows="4" placeholder="请输入内容..."></textarea>
      </div>
      <button class="action" id="sendBtn">发送</button>
      <button class="action" id="newSessionBtn">新会话</button>
      <span id="chatStatus"></span>
    </div>

    <div id="configPanel" class="panel">
      <h2>模型配置</h2>
      <div class="row">
        <label>本地模型名</label>
        <input id="localModel" />
      </div>
      <div class="row">
        <label>本地模型地址（可选）</label>
        <input id="localEndpoint" />
      </div>
      <div class="row">
        <label>云端 Base URL</label>
        <input id="cloudBaseUrl" />
      </div>
      <div class="row">
        <label>云端 API Key</label>
        <input id="cloudApiKey" type="password" />
      </div>
      <div class="row">
        <label>云端模型名</label>
        <input id="cloudModel" />
      </div>
      <button class="action" id="saveConfigBtn">保存配置</button>
      <button class="action" id="testLocalBtn">测试本地</button>
      <button class="action" id="testCloudBtn">测试云端</button>
      <p id="configStatus"></p>
    </div>
  </section>
</main>

<script>
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(tab.dataset.target).classList.add('active');
  }));

  let sessionId = null;
  let messages = [];

  function appendMessage(role, content) {
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = `${role}: ${content}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  async function loadHealth() {
    const t = document.getElementById('healthText');
    const p = document.getElementById('healthPayload');
    try {
      const res = await fetch('/health');
      const data = await res.json();
      p.textContent = JSON.stringify(data, null, 2);
      t.textContent = res.ok ? '✅ 服务正常' : '⚠️ 服务异常';
      t.className = res.ok ? 'ok' : 'err';
    } catch (e) {
      t.textContent = '❌ 服务不可达';
      t.className = 'err';
      p.textContent = String(e);
    }
  }

  async function loadConfig() {
    const res = await fetch('/api/config');
    const data = await res.json();
    const cfg = data.config || {};
    const local = (cfg.providers || {}).local || {};
    const cloud = (cfg.providers || {}).cloud || {};
    document.getElementById('localModel').value = local.model || '';
    document.getElementById('localEndpoint').value = local.endpoint || '';
    document.getElementById('cloudBaseUrl').value = cloud.base_url || '';
    document.getElementById('cloudApiKey').value = cloud.api_key || '';
    document.getElementById('cloudModel').value = cloud.model || '';
  }

  async function saveConfig() {
    const payload = {
      config: {
        app: { name: 'openclaw-desktop', version: '0.1.0' },
        providers: {
          local: {
            enabled: true,
            model: document.getElementById('localModel').value,
            endpoint: document.getElementById('localEndpoint').value,
          },
          cloud: {
            enabled: true,
            base_url: document.getElementById('cloudBaseUrl').value,
            api_key: document.getElementById('cloudApiKey').value,
            model: document.getElementById('cloudModel').value,
            timeout_s: 45,
          }
        }
      }
    };

    const res = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    const s = document.getElementById('configStatus');
    if (res.ok) {
      s.textContent = '✅ 配置已保存';
      s.className = 'ok';
    } else {
      s.textContent = `❌ 保存失败: ${data.error || 'unknown'}`;
      s.className = 'err';
    }
  }

  async function testProvider(provider) {
    const res = await fetch('/v1/config/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider })
    });
    const data = await res.json();
    const s = document.getElementById('configStatus');
    if (res.ok && data.ok) {
      s.textContent = `✅ ${provider} 连接测试通过`;
      s.className = 'ok';
    } else {
      s.textContent = `❌ ${provider} 测试失败: ${data.error_message || data.error || 'unknown'}`;
      s.className = 'err';
    }
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    const provider = document.getElementById('provider').value;
    const model = document.getElementById('model').value.trim() || 'local-echo';
    messages.push({ role: 'user', content: text });
    appendMessage('user', text);
    input.value = '';

    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider, model, session_id: sessionId, messages })
    });
    const data = await res.json();
    const status = document.getElementById('chatStatus');

    if (!res.ok) {
      status.textContent = `❌ ${data.error || '发送失败'}`;
      status.className = 'err';
      return;
    }

    sessionId = data.session_id;
    messages.push({ role: 'assistant', content: data.content });
    appendMessage('assistant', data.content);
    status.textContent = `✅ 已回复（session: ${sessionId.slice(0, 8)}）`;
    status.className = 'ok';
  }

  document.getElementById('refreshHealth').addEventListener('click', loadHealth);
  document.getElementById('saveConfigBtn').addEventListener('click', saveConfig);
  document.getElementById('testLocalBtn').addEventListener('click', () => testProvider('local'));
  document.getElementById('testCloudBtn').addEventListener('click', () => testProvider('cloud'));
  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('newSessionBtn').addEventListener('click', () => {
    sessionId = null;
    messages = [];
    document.getElementById('chatBox').innerHTML = '';
    document.getElementById('chatStatus').textContent = '已新建会话';
  });

  loadHealth();
  loadConfig();
</script>
</body>
</html>
